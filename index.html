<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Three.js Plane Scene</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { display: block; }


  </style>
</head>
<body>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ─────────────────────────────────────────────
//  RENDERER
// ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ─────────────────────────────────────────────
//  SCENE & CAMERA
// ─────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 200);
camera.position.set(4, 3.5, 6);
camera.lookAt(0, 0.5, 0);

// ─────────────────────────────────────────────
//  ORBIT CONTROLS
// ─────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.5;
controls.maxDistance = 30;
controls.target.set(0, 0, 0);
controls.update();

// ─────────────────────────────────────────────
//  SHADER — procedural stripe material
// ─────────────────────────────────────────────
const vertexShader = /* glsl */`
  varying vec2 vUv;
  varying vec3 vNormal;
  varying vec3 vViewPos;

  void main() {
    vUv     = uv;
    vNormal = normalize(normalMatrix * normal);
    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
    vViewPos   = -mvPos.xyz;
    gl_Position = projectionMatrix * mvPos;
  }
`;

const fragmentShader = /* glsl */`
  uniform float uOffset;

  varying vec2  vUv;
  varying vec3  vNormal;
  varying vec3  vViewPos;

  const vec3  COLOR_A      = vec3(0.353, 0.337, 0.275);  // #5a5646
  const vec3  COLOR_B      = vec3(0.227, 0.220, 0.216);  // #3a3837
  const float STRIPE_COUNT = 1.5;

  // ── Classic 2-D Perlin noise ──────────────────────────────────────────
  vec2 fade(vec2 t) { return t * t * t * (t * (t * 6.0 - 15.0) + 10.0); }

  float grad(float h, vec2 p) {
    h = mod(floor(h), 4.0);
    if (h < 1.0) return  p.x + p.y;
    if (h < 2.0) return -p.x + p.y;
    if (h < 3.0) return  p.x - p.y;
                 return -p.x - p.y;
  }

  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
  }

  float perlin(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = fade(f);
    float a = hash(i + vec2(0.0, 0.0));
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    float ga = grad(a * 4.0, f - vec2(0.0, 0.0));
    float gb = grad(b * 4.0, f - vec2(1.0, 0.0));
    float gc = grad(c * 4.0, f - vec2(0.0, 1.0));
    float gd = grad(d * 4.0, f - vec2(1.0, 1.0));
    return mix(mix(ga, gb, u.x), mix(gc, gd, u.x), u.y);
  }

  // fBm — two octaves for detail
  float fbm(vec2 p) {
    return perlin(p) * 0.6 + perlin(p * 2.1) * 0.4;
  }
  // ─────────────────────────────────────────────────────────────────────

  void main() {
    // ── stripe colour ─────────────────────────────────────────────────
    float v = fract(vUv.x * STRIPE_COUNT + uOffset);
    float t = 0.5 + 0.5 * sin(v * 6.2831853);
    vec3 stripeColor = mix(COLOR_A, COLOR_B, t);

    // ── Perlin roughness — offset in Y at same rate as stripes ────────
    vec2 noiseUv = vec2(vUv.x * 4.0 + uOffset * STRIPE_COUNT, vUv.y * 4.0);
    float noise  = fbm(noiseUv);
    float rough  = clamp(0.55 + noise * 0.5, 0.1, 1.0);

    // ── lighting ──────────────────────────────────────────────────────
    vec3 N = normalize(vNormal);
    vec3 V = normalize(vViewPos);

    vec3  L1     = normalize(vec3(-0.55, 0.72, 0.42));
    float diff1  = max(dot(N, L1), 0.0);
    vec3  H1     = normalize(L1 + V);
    float shine1 = mix(128.0, 4.0, rough);
    float spec1  = pow(max(dot(N, H1), 0.0), shine1) * mix(0.6, 0.05, rough);

    vec3  L2     = normalize(vec3(0.62, 0.60, -0.49));
    float diff2  = max(dot(N, L2), 0.0) * 0.6;
    vec3  H2     = normalize(L2 + V);
    float shine2 = mix(128.0, 4.0, rough);
    float spec2  = pow(max(dot(N, H2), 0.0), shine2) * mix(0.4, 0.03, rough);

    vec3 lit = stripeColor * (diff1 + diff2) + vec3(spec1 + spec2);

    gl_FragColor = vec4(lit, 1.0);
  }
`;

const planeMat = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms: {
    uOffset: { value: 0.0 }
  },
  side: THREE.DoubleSide
});

// ─────────────────────────────────────────────
//  PLANE  (5 m wide × 8 m deep)
// ─────────────────────────────────────────────
const planeGeo = new THREE.PlaneGeometry(9, 3);
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x = -Math.PI / 2;
plane.receiveShadow = true;
scene.add(plane);

const farLight = new THREE.SpotLight( 0x88ffff, 3);
farLight.position.set( -2, 8, 2);
//spotLight.map = new THREE.TextureLoader().load( url );
farLight.castShadow = true;
farLight.shadow.mapSize.width = 1024;
farLight.shadow.mapSize.height = 1024;
farLight.shadow.camera.near = 5;
farLight.shadow.camera.far = 100;
farLight.shadow.camera.fov = 30;

// ─────────────────────────────────────────────
//  SPOTLIGHTS  (no ambient — only 2 spots)
// ─────────────────────────────────────────────
function makeSpot(color, intensity, posX, posY, posZ, angle, penumbra) {
  const spot = new THREE.SpotLight(color, intensity);
  spot.position.set(posX, posY, posZ);
  spot.angle    = angle;
  spot.penumbra = penumbra;
  spot.decay    = 1.8;
  spot.distance = 20;
  spot.castShadow = true;
  spot.shadow.mapSize.set(1024, 1024);
  spot.shadow.camera.near = 0.5;
  spot.shadow.camera.far  = 20;
  spot.target.position.set(0.25, 0, 0);
  scene.add(spot);
  scene.add(spot.target);
  return spot;
}

const spot1 = makeSpot(0xffeedd, 2, -3, 5,   3.5, Math.PI / 7, 0.35);
const spot2 = makeSpot(0xaaddff, 1,  4, 4.5, -3,  Math.PI / 8, 0.45);

// ─────────────────────────────────────────────
//  RESIZE HANDLER
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─────────────────────────────────────────────
//  ANIMATE
// ─────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  const yOffset = (t * 4.0) % 1.0;
  planeMat.uniforms.uOffset.value = yOffset;

  spot1.position.x = Math.sin(t * 0.18) * 4;
  spot1.position.z = Math.cos(t * 0.18) * 4;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
